<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotOR II Style Character Sheet</title>
    <style>
        :root {
            --bg-metallic: #7f6a4e; 
            --bg-screen: #000000;
            --panel-bg: rgba(6, 18, 16, 0.85); 
            --border-neon: #00ffcc; 
            --text-neon: #00ffcc;
            --text-muted: #4ab3a2;
            --text-bright: #ffffff;
            --border-dim: #1e5a52;
            --alignment-glow: rgba(0, 255, 204, 0.1);
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-metallic);
            background-image: linear-gradient(90deg, #614f37 0%, #8c7659 50%, #614f37 100%);
            color: var(--text-muted);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .console-frame {
            background-color: var(--bg-screen);
            border: 4px solid #3d3121;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 950px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid var(--border-dim);
            border-radius: 8px;
            padding: 8px 20px;
            margin-bottom: 25px;
            background-color: rgba(3, 10, 9, 0.9);
        }

        .menu-title {
            color: var(--text-bright);
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.2rem;
            text-shadow: 0 0 5px var(--text-neon);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .profile-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 440px;
            box-shadow: inset 0 0 15px var(--alignment-glow);
            transition: box-shadow 0.4s ease;
            box-sizing: border-box;
        }

        .avatar-placeholder {
            width: 160px;
            height: 220px;
            border: 2px solid var(--border-dim);
            background: linear-gradient(180deg, rgba(0,255,204,0.05) 0%, rgba(0,0,0,0.4) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--border-dim);
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }

        .avatar-placeholder::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 204, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
        }

        .alignment-container {
            width: 100%;
            margin-top: 15px;
            text-align: center;
        }

        .alignment-label {
            font-size: 0.8rem;
            color: var(--text-bright);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
        }

        .alignment-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 3px;
            background: linear-gradient(90deg, #ff3333 0%, #334444 50%, #00ccff 100%);
            outline: none;
            border: 1px solid var(--border-dim);
        }

        .alignment-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 20px;
            background: var(--text-bright);
            border: 1px solid var(--border-neon);
            cursor: pointer;
            box-shadow: 0 0 8px var(--border-neon);
        }

        .stats-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            padding: 20px;
            box-sizing: border-box;
            min-height: 440px;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
        }

        .stats-table th {
            text-align: left;
            padding: 8px 10px;
            font-size: 0.75rem;
            color: var(--text-bright);
            border-bottom: 2px solid var(--border-dim);
            text-transform: uppercase;
        }

        .stats-table td {
            padding: 9px 10px;
            border-bottom: 1px solid rgba(30, 90, 82, 0.3);
            vertical-align: middle;
        }

        .stat-name {
            color: var(--text-bright);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .stat-input {
            background: transparent;
            border: none;
            color: var(--text-bright);
            font-family: inherit;
            font-size: 1rem;
            width: 45px;
            text-align: center;
            border-bottom: 1px dashed var(--border-dim);
        }

        .stat-input:focus {
            outline: none;
            border-bottom: 1px solid var(--border-neon);
            color: var(--text-neon);
        }

        .stat-mod {
            color: var(--text-neon);
            font-weight: bold;
            text-align: right;
            width: 50px;
        }

        .compound-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .compound-row input {
            width: 35px;
        }

        .character-footer-details {
            margin-top: 25px;
            border-top: 2px solid var(--border-dim);
            padding-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }

        .footer-field {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }

        .footer-field label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .footer-field input {
            background: transparent;
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            color: var(--text-bright);
            padding: 6px 10px;
            font-family: inherit;
        }

        .footer-field input:focus {
            outline: none;
            border-color: var(--border-neon);
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .close-btn {
            background-color: transparent;
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            font-family: inherit;
            text-transform: uppercase;
            padding: 6px 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-btn:hover {
            border-color: var(--border-neon);
            color: var(--text-bright);
            background-color: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        .autosave-msg {
            font-size: 0.75rem;
            color: var(--text-neon);
            margin-right: auto;
            align-self: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .autosave-msg.visible {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="console-frame">
    <div class="menu-header">
        <div class="menu-title">Character Menu</div>
        <div style="font-size: 0.8rem; color: var(--border-dim);">SYSTEM_PERSISTENCE_ACTIVE</div>
    </div>

    <!-- Core Layout Grid -->
    <div class="main-layout">
        
        <!-- Left Column: Visual Projection & Alignment -->
        <div class="profile-panel" id="profilePanel">
            <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-bright); width: 100%;">Biometric Projection</div>
            
            <div class="avatar-placeholder">
                <span style="font-size: 0.8rem; letter-spacing: 1px;">[ NO_SIGNAL ]</span>
            </div>

            <div class="alignment-container">
                <div class="alignment-label">
                    <span style="color: #ff5555; font-weight: bold;">DARK</span>
                    <span style="color: var(--text-bright)">ALIGNMENT</span>
                    <span style="color: #55ccff; font-weight: bold;">LIGHT</span>
                </div>
                <input type="range" id="alignment" min="0" max="100" value="50" class="alignment-slider save-field">
            </div>
        </div>

        <!-- Right Column: Stats Panel Container -->
        <div class="stats-panel">
